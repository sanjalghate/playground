<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remove Buttons</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; background: #fff; color: #222; }
  label { display: block; margin-bottom: 16px; font-size: 16px; }
  .btn { margin: 4px; padding: 6px 12px; }
  #log { font-family: monospace; font-size: 13px; white-space: pre-wrap; background: #f5f5f5; padding: 8px; margin-top: 16px; min-height: 40px; }
</style>
</head>
<body>
<h1>Remove Buttons (LCNC-22867)</h1>

<label><input type="checkbox" id="hide-buttons"> Hide buttons</label>

<div id="btn-wrap">
  <button class="btn" data-label="btn-1">Button 1</button>
  <button class="btn" data-label="btn-2">Button 2</button>
  <button class="btn" data-label="btn-3">Button 3</button>
</div>

<div id="log"></div>

<script>
  const KEY = 'removeButtons.hide';
  const wrap = document.getElementById('btn-wrap');
  const box = document.getElementById('hide-buttons');
  const logEl = document.getElementById('log');
  const buttonsHtml = wrap.innerHTML;
  const log = (msg) => { logEl.textContent += `${new Date().toLocaleTimeString()}  ${msg}\n`; };

  const readHide = () => { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } };
  const writeHide = (v) => { try { localStorage.setItem(KEY, v ? '1' : '0'); } catch (e) { /* storage blocked */ } };

  const render = (hide) => {
    if (hide) {
      wrap.innerHTML = '';
      log('buttons removed');
    } else {
      wrap.innerHTML = buttonsHtml;
      wrap.querySelectorAll('.btn').forEach((b) => b.addEventListener('click', () => log(`clicked ${b.dataset.label}`)));
    }
  };

  box.checked = readHide(); // persists across reload, so the run's page load starts with no buttons
  render(box.checked);
  box.addEventListener('change', () => { writeHide(box.checked); render(box.checked); });
</script>
</body>
</html>
